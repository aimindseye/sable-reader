name: Android

# Builds the release APK and runs the unit tests, Android Lint, detekt and ktlint.
# The release APK here is unsigned and never published; releases are signed on the owner's computer
# (docs/RELEASING.md).
# Documentation-only changes skip the build (security.yml still scans them).
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'NOTICE'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK 36
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Build, test and check
        run: >-
          ./gradlew --no-daemon --console=plain --continue
          :leisure:assembleSableRelease
          test
          :leisure:lintSableDebug :leisure:processSableDebugMainManifest
          detekt ktlintCheck
      - name: The app has its package name and asks for no network or camera
        run: bash tools/check-apk.sh leisure/build/outputs/apk/sable/release
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk-unsigned
          path: leisure/build/outputs/apk/sable/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          path: '**/build/reports/'
          if-no-files-found: ignore
          retention-days: 14
